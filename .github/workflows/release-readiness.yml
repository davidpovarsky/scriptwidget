name: Release Readiness

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: release-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editor-and-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - uses: actions/checkout@v7
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Editor/editorfe/package-lock.json
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - run: npm ci
        working-directory: Editor/editorfe
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - run: SCRIPTWIDGET_SKIP_XCODE=1 ./Scripts/release-readiness.sh

  apple-platforms:
    runs-on: macos-26
    steps:
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - uses: actions/checkout@v7
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Editor/editorfe/package-lock.json
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - run: npm ci
        working-directory: Editor/editorfe
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Report Apple toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - run: ./Scripts/release-readiness.sh
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - run: ./Scripts/ipad-icloud-tests.sh
